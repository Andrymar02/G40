[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "io-util", "io-std", "fs", "time"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# default-features = false + filter-by-regex: senza, chrono-tz incorpora
# l'intero database IANA (circa 600 fusi con tutte le regole storiche di ora
# legale) e da solo raddoppia l'eseguibile. Il fuso che serve e' uno.
chrono-tz = { version = "0.10", default-features = false, features = ["filter-by-regex"] }
sysinfo = "0.33"
